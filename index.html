<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MV LEDs Gestão</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#08090a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MV Gestão" />
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

<main class="app">
  <section class="view" id="view-inicio" data-view="inicio"></section>
  <section class="view" id="view-estoque" data-view="estoque" hidden></section>
  <section class="view" id="view-agenda" data-view="agenda" hidden></section>
  <section class="view" id="view-mandar" data-view="mandar" hidden></section>
</main>

<nav class="tabbar" aria-label="Seções">
  <button type="button" class="tab is-ativo" data-tab="inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Início</span>
  </button>
  <button type="button" class="tab" data-tab="estoque">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
    <span>Estoque</span>
  </button>
  <button type="button" class="tab" data-tab="agenda">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Agenda</span>
  </button>
  <button type="button" class="tab" data-tab="mandar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    <span>Mandar</span>
  </button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-fundo" data-fechar></div>
  <div class="sheet-painel" role="dialog" aria-modal="true" aria-labelledby="sheetTitulo">
    <header class="sheet-topo">
      <button type="button" class="link" data-fechar>Fechar</button>
      <h2 id="sheetTitulo"></h2>
      <span class="sheet-acao" id="sheetAcao"></span>
    </header>
    <div class="sheet-corpo" id="sheetCorpo"></div>
  </div>
</div>

<div class="dialogo" id="dialogo" hidden>
  <div class="dialogo-caixa" role="alertdialog" aria-modal="true" aria-labelledby="dialogoTitulo">
    <h2 id="dialogoTitulo"></h2>
    <p id="dialogoTexto"></p>
    <div class="dialogo-acoes">
      <button type="button" class="btn btn--secundario" id="dialogoNao">Cancelar</button>
      <button type="button" class="btn btn--perigo" id="dialogoSim">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/util.js?v=2"></script>
<script src="js/db.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/inicio.js?v=2"></script>
<script src="js/estoque.js?v=2"></script>
<script src="js/agenda.js?v=2"></script>
<script src="js/mandar.js?v=2"></script>
<script src="js/ajustes.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
